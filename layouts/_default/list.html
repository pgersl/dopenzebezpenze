{{define "styles"}}
    <link rel="stylesheet" href="/css/list.css">
{{end}}

{{define "scripts"}}
{{end}}

{{define "main"}}
    {{ partial "header.html" . }}
    <article>
        {{ range .Pages }}
            <a class="list-card" href="{{.RelPermalink}}">
                <img src="{{.Params.image}}" alt="{{.Title}}">
                <h4>{{.Title}}</h4>
                <p>{{.Params.heading}}</p>
            </a>
        {{ end }}
    </article>
{{end}}
