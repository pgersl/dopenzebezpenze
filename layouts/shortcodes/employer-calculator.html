<section class="calculator">
    <h2>
        <span class="sup-heading">Příspěvek nebo zvýšení mzdy</span>
        Kolik je možné na příspěvcích ušetřit?
    </h2>
    <div id="calculator">
        <div class="col">
            <div class="input">
                <label for="employer-monthly">Částka (Kč)</label>
                <input type="number" id="employer-monthly" min="0" max="4166" step="100" value="3000">
            </div>
            <div class="input">
                <label for="employer-employees">Počet zaměstnanců</label>
                <input type="number" id="employer-employees" min="0" value="10">
            </div>
            <div class="savings">
                <label>Měsíční úspora</label>
                <span id="savings"></span>
                <span class="savings-info">Snížení nákladů o sociální a zdravotní pojištění</span>
            </div>
        </div>
        <div class="col">
            <canvas id="chart"></canvas>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
        <script src="/js/employers.js" defer></script>
    </div>
</section>
