<section class="calculator">
    <h2>
        <span class="sup-heading">Investiční kalkulačka</span>
        Jak vypadá investice v čase?
    </h2>
    <div id="calculator">
        <div class="col">
            <div class="input">
                <label for="employee-monthly">Měsíční úložka (Kč)</label>
                <input type="number" id="employee-monthly" min="0" step="100" value="1500">
            </div>
            <div class="input">
                <label for="employer-monthly">Příspěvek zaměstnavatele (Kč)</label>
                <input type="number" id="employer-monthly" min="0" step="100" value="1334">
            </div>
            <div class="input">
                <label for="employee-years">Investiční horizont (roky)</label>
                <input type="number" id="employee-years" min="0" max="100" step="1" value="25">
            </div>
            <div class="savings">
                <label>Budoucí hodnota</label>
                <span id="savings"></span>
                <span class="savings-info">Při výnosnosti 7,9 % p.a.</span>
            </div>
        </div>
        <div class="col" id="growth-chart" style="padding:2rem; min-height:450px;">
            <canvas id="chart"></canvas>
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
        <script src="/js/employees.js" defer></script>
    </div>
    <div class="disclaimer">
        <p>Investiční kalkulačka slouží jen jako ukázka vlivu složeného úročení na vložené prostředky. Není v žádném případě zárukou nebo indikací budoucích výnosů.</p>
    </div>
</section>
